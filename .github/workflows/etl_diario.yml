name: Pipeline ETL Diario - Cotacoes

on:
  schedule:
    # Executa de segunda a sexta-feira às 22:00 UTC (19:00 Horário de Brasília) após fechamento de mercado
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite disparo manual via interface do GitHub

jobs:
  executar_etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline ETL
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python pipeline_cotacoes.py
