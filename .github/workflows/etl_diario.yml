name: Pipeline ETL Diario - Cotacoes

on:
  schedule:
    # Executa de terca a sabado as 09:15 UTC (06:15 Horario de Brasilia) processando o pregao consolidado da vespera
    - cron: '15 9 * * 2,3,4,5,6'
  workflow_dispatch:
    inputs:
      force_reanalise:
        description: 'Forcar reexecucao da analise de IA mesmo se ja existir no banco'
        required: false
        default: 'false'

jobs:
  executar_etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Cotacoes (Fato_Cotacao)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python pipeline_cotacoes.py

      - name: Executar Analise de Mercado Quant + IA (Fato_Analise_Mercado)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REANALISE: ${{ inputs.force_reanalise || 'false' }}
        run: |
          python pipeline_analise_mercado.py

